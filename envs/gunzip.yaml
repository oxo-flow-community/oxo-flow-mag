---
# Environment for gunzip — pinned exactly to the upstream
# nf-core/mag 5.5.0 upstream nf-core/gunzip module environment (modules/nf-core/gunzip/main/environment.yml); tar pinned additionally because the oxo-flow port has no container layer.
# Channel-qualified pins removed: bioconda does not carry coreutils=9.5
# (PackagesNotFoundError); conda-forge provides all pinned versions.
name: gunzip
channels:
  - conda-forge
  - bioconda
dependencies:
  - coreutils=9.5
  - grep=3.11
  - gzip=1.13
  - lbzip2=2.5
  - sed=4.8
  - tar=1.34
