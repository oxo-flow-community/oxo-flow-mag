---
# Environment for gtdbtk_db_preparation — pinned exactly to the upstream
# nf-core/mag 5.5.0 upstream nf-core/mag gtdbtk_db_preparation local module environment (modules/local/gtdbtk_db_preparation/environment.yml); tar pinned additionally because the oxo-flow port has no container layer.
# Channel-qualified pins removed: bioconda does not carry coreutils=9.5
# (PackagesNotFoundError); conda-forge provides all pinned versions.
name: gtdbtk_db_preparation
channels:
  - conda-forge
  - bioconda
dependencies:
  - coreutils=9.5
  - grep=3.11
  - gzip=1.13
  - tar=1.34
