---
# Environment for the freebayes + bcftools consensus chain — upstream pins
# (freebayes=1.3.10 + htslib=1.22.1, bcftools=1.22; the consensus step
# shares one env because freebayes env already carries bcftools/htslib).
name: freebayes
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::freebayes=1.3.10
  - bioconda::htslib=1.22.1
  - bioconda::bcftools=1.22
